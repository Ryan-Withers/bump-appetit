<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A15" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bub Appetit">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<title>Bub Appetit</title>
<meta name="description" content="Newborn questions, answered straight. Type what is happening, get the answer and who to ring, from four Australian sources.">

<!-- Both faces are variable woff2, latin subset, and both are used above the
     fold (greeting in Bricolage, everything else in Nunito Sans). -->
<link rel="preload" href="assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="assets/styles.css">
<script type="module" src="assets/js/app.js"></script>
</head>
<body>

<a class="sr-only" href="#main" data-string="a11y.skipToContent">Skip to content</a>

<noscript>
  <div class="empty">
    <p class="empty__title">Bub Appetit needs JavaScript</p>
    <p>Turn JavaScript on in Safari settings and reload, and the whole cookbook comes back. Until then: freshly cooked, steaming hot, from a clean kitchen is the safest bet.</p>
  </div>
</noscript>

<main class="app" id="main" tabindex="-1">
  <section class="view is-active" id="view-search" role="tabpanel" aria-labelledby="tab-search">
    <div class="view__inner"></div>
  </section>
  <section class="view" id="view-track" role="tabpanel" aria-labelledby="tab-track">
    <div class="view__inner"></div>
  </section>
  <section class="view" id="view-week" role="tabpanel" aria-labelledby="tab-week">
    <div class="view__inner"></div>
  </section>
  <section class="view" id="view-more" role="tabpanel" aria-labelledby="tab-more">
    <div class="view__inner"></div>
  </section>
</main>

<!-- Tab labels carry a data-string hook so app.js can swap them for STRINGS
     values, but they ship with real text so the spine of the app is never
     blank on a slow or failed module load. -->
<div class="tabbar" role="tablist" aria-label="Bub Appetit sections">
  <button class="tab is-active" type="button" id="tab-search" role="tab" aria-selected="true" aria-controls="view-search">
    <span class="tab__icon" data-icon="search"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
    <span class="tab__label" data-string="tabs.search">Search</span>
  </button>
  <button class="tab" type="button" id="tab-track" role="tab" aria-selected="false" aria-controls="view-track">
    <span class="tab__icon" data-icon="clock"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
    <span class="tab__label" data-string="tabs.track">Track</span>
  </button>
  <button class="tab" type="button" id="tab-week" role="tab" aria-selected="false" aria-controls="view-week">
    <span class="tab__icon" data-icon="calendar"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg></span>
    <span class="tab__label" data-string="tabs.week">Week</span>
  </button>
  <button class="tab" type="button" id="tab-more" role="tab" aria-selected="false" aria-controls="view-more">
    <span class="tab__icon" data-icon="menu"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg></span>
    <span class="tab__label" data-string="tabs.more">More</span>
  </button>
</div>

<div class="sheet-backdrop" hidden></div>

<section class="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet__handle"></div>
  <button class="sheet__close" type="button" aria-label="Close" data-string-attr="aria-label:a11y.close">
    <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
  </button>
  <div class="sheet__body"></div>
</section>

<div class="toast" role="status" aria-live="polite" hidden></div>

<div class="install-hint" hidden></div>

</body>
</html>
