name: Deploy scanner Worker

# Push-only on purpose. A pull request from a fork can never trigger this
# workflow, so a stranger's PR can never reach the Cloudflare token.
on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, newest wins. Two overlapping deploys of the same Worker
# is a race with nothing to gain.
concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    # Only ever from the default branch, whatever it is called. A feature branch
    # must never overwrite the live Worker, and hardcoding a branch name here
    # once meant this workflow silently never ran at all.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Secrets are not readable from a job-level `if`, so the guard is a step.
      # This repo may sit for months with no Cloudflare account attached, and a
      # red cross on every push would train Ryan to ignore CI.
      - name: Look for the Cloudflare token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Worker not deployed::No CLOUDFLARE_API_TOKEN repo secret is set, so the scan Worker was skipped. The app is fine without it: the Scan screen offers basic on-device reading until CONFIG.scanner.endpoint is filled in.'
          fi

      - name: Deploy with wrangler
        if: steps.token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: deploy
